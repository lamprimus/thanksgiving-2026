<style>
/* Layout: one screen. Neon title sign on top, the playable diorama in the middle, controls underneath. */
:root {
  --night: #0b0a1f;
  --panel: #1a1638;
  --ink: #f4ecff;
  --dim: #a59bd0;
  --pink: #ff6ebe;
  --cyan: #6eebff;
  --gold: #ffd66e;
  --display: 'Press Start 2P', 'Courier New', monospace;
  --body: 'DotGothic16', 'Courier New', monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  box-sizing: border-box;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.jp { color: var(--cyan); letter-spacing: 0.4em; font-size: 15px; text-shadow: 0 0 8px var(--cyan); margin: 0; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(17px, 4.4vw, 40px);
  line-height: 1.2;
  color: #fff4fb;
  text-shadow: 0 0 4px #fff, 0 0 12px var(--pink), 0 0 30px var(--pink);
  animation: flicker 6s infinite;
}
h1 span { animation: flicker 3.7s infinite 1.3s; }
@keyframes flicker { 0%, 17%, 19%, 21%, 23%, 66%, 68%, 100% { opacity: 1; } 18%, 22%, 67% { opacity: 0.35; } }
.meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 18px; }
.when { margin: 0; color: var(--gold); font-size: 18px; text-shadow: 0 0 8px rgba(255, 214, 110, 0.6); }
.rsvp {
  font-family: var(--display);
  font-size: 12px;
  color: var(--night);
  background: var(--gold);
  padding: 9px 12px;
  text-decoration: none;
  box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--gold), 0 0 18px rgba(255, 214, 110, 0.5);
}
.rsvp:hover { background: #fff; }
a:focus-visible, button:focus-visible, canvas:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.stage { flex: 1 1 auto; align-self: stretch; min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.view { position: relative; flex: none; width: 100%; aspect-ratio: 496 / 368; }
canvas { cursor: pointer; display: block; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  background: var(--ink);
  color: var(--night);
  padding: 6px 9px;
  font-size: 14px;
  line-height: 1.3;
  width: max-content;
  max-width: 62%;
  text-align: center;
  box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.bubble a { color: #b3126c; font-weight: 700; }
footer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hint { margin: 0; color: var(--dim); font-size: 14px; text-align: center; text-wrap: balance; }
.hint b { color: var(--gold); font-weight: 400; }
@media (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { h1, h1 span { animation: none; } }
</style>

  const bubbleText = document.getElementById('bubbleText');
  const bubbleLink = document.getElementById('bubbleLink');
  const rsvpLink = document.getElementById('rsvpLink');
  let spot = null, armed = true;

  const keys = { up: false, down: false, left: false, right: false };
  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  // click or tap to walk: breadth-first search over a 2-unit grid of standable spots
  const G = 2, GC = Math.floor((FX - PS) / G) + 1, GR = Math.floor((FY - PS) / G) + 1;
  const grid = new Uint8Array(GC * GR);
  for (let j = 0; j < GR; j++) for (let i = 0; i < GC; i++) grid[j * GC + i] = free(i * G, j * G) ? 1 : 0;
  let path = null, goal = null;
  function walkTo(tx, ty) {
    const si = Math.max(0, Math.min(GC - 1, Math.round(pl.x / G))), sj = Math.max(0, Math.min(GR - 1, Math.round(pl.y / G)));
    let start = sj * GC + si;
    if (!grid[start]) {
      let bd = 1e9;
      for (let k = 0; k < grid.length; k++) if (grid[k]) { const d = Math.hypot((k % GC) * G - pl.x, Math.floor(k / GC) * G - pl.y); if (d < bd) { bd = d; start = k; } }
    }
    const prev = new Int32Array(GC * GR).fill(-1), q = [start];
    prev[start] = start;
    let best = start, bestD = 1e9;
    for (let h = 0; h < q.length; h++) {
      const k = q[h], i = k % GC, j = Math.floor(k / GC);
      const d = Math.hypot(i * G - tx, j * G - ty);
      if (d < bestD) { bestD = d; best = k; }
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ni = i + di, nj = j + dj;
        if (ni < 0 || nj < 0 || ni >= GC || nj >= GR) continue;
        const nk = nj * GC + ni;
        if (!grid[nk] || prev[nk] >= 0) continue;
        if (di && dj && (!grid[j * GC + ni] || !grid[nj * GC + i])) continue;
        prev[nk] = k; q.push(nk);
      }
    }
    const pts = [];
    for (let k = best; k !== start; k = prev[k]) pts.push([(k % GC) * G, Math.floor(k / GC) * G]);
    pts.push([(start % GC) * G, Math.floor(start / GC) * G]);
    path = pts.reverse();
    goal = path[path.length - 1];
  }
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect();
    const sx = (e.clientX - r.left) * VW / r.width + Math.round(camX) - OX, sy = (e.clientY - r.top) * VH / r.height + Math.round(camY) - OY;
    walkTo(sy + sx / 2 - PS / 2, sy - sx / 2 - PS / 2);
  });

  const CAR_KEYS = Object.keys(D.cars);
  const LANES = [{ y: 160, dir: 1, key: 'p' }, { y: 192, dir: -1, key: 'm' }];
  let cars = [], nextCar = 1;

  function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
  const jobs = [];
  const I = {}, PI = {}, CI = {};
  Object.keys(D.img).forEach(k => jobs.push(load(D.img[k]).then(i => { I[k] = i; })));
  ['y', 'x', 'n'].forEach(f => jobs.push(load(D.player[f].uri).then(i => { PI[f] = i; })));
  CAR_KEYS.forEach(k => ['p', 'm'].forEach(d => jobs.push(load(D.cars[k][d].uri).then(i => { CI[k + d] = i; }))));
  Promise.all(jobs).then(() => {
    function order(pb) {
      const done = new Uint8Array(n + 1), out = [], pp = [], front = new Uint8Array(n);
      for (let i = 0; i < n; i++) { const r = behind(B[i], pb); if (r === true) pp.push(i); else if (r === false) front[i] = 1; }
      function emit(i) {
        if (done[i]) return;
        done[i] = 1;
        if (i === n) { for (const p of pp) emit(p); out.push(-1); return; }
        for (const p of preds[i]) emit(p);
        if (front[i]) emit(n);
        out.push(i);
      }
      for (let i = 0; i < n; i++) emit(i);
      emit(n);
      return out;
    }

    function step(dt) {
      let dx = 0, dy = 0;
      if (keys.up) { dx -= 1; dy -= 1; }
      if (keys.down) { dx += 1; dy += 1; }
      if (keys.left) { dx -= 1; dy += 1; }
      if (keys.right) { dx += 1; dy -= 1; }
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      if (m) { path = null; goal = null; }
      if (!m && path) {
        let left = 50 * dt;
        pl.moving = true;
        while (path && left > 0) {
          const w = path[0], ex = w[0] - pl.x, ey = w[1] - pl.y, dist = Math.hypot(ex, ey);
          if (dist <= left) { pl.x = w[0]; pl.y = w[1]; left -= dist; path.shift(); if (!path.length) { path = null; goal = null; } }
          else { pl.x += ex / dist * left; pl.y += ey / dist * left; left = 0; }
          if (dist > 0.01) pl.face = ey > 0.01 ? 'y' : (ex > 0.01 ? 'x' : 'n');
        }
        return;
      }
      pl.moving = m > 0;
      if (!m) return;
      dx /= m; dy /= m;
      const v = 50 * dt;
      if (free(pl.x + dx * v, pl.y)) pl.x += dx * v;
      if (free(pl.x, pl.y + dy * v)) pl.y += dy * v;
      pl.face = dy > 0 ? 'y' : (dx > 0 ? 'x' : 'n');
    }

    function stepCars(t, dt) {
      if (calm) return;
      if (t > nextCar) {
        const lane = LANES[Math.random() < 0.5 ? 0 : 1];
        if (!cars.some(c => c.lane === lane)) {
          const k = CAR_KEYS[Math.floor(Math.random() * CAR_KEYS.length)], L = D.cars[k].L;
          cars.push({ k: k, lane: lane, L: L, x: lane.dir > 0 ? -L : FX, v: (64 + Math.random() * 30) * lane.dir });
        }
        nextCar = t + 2.5 + Math.random() * 4.5;
      }
      for (const c of cars) c.x += c.v * dt;
      cars = cars.filter(c => c.x > -c.L - 1 && c.x < FX + 1);
    }

    function checkDoor() {
      const inZone = pl.x > 142 && pl.x < 167 && pl.y < 2;
      if (inZone && armed) { armed = false; rsvpLink.click(); }
      if (pl.y > 18) armed = true;
    }

    function camera(dt) {
      const q = P(pl.x + PS / 2, pl.y + PS / 2, 8);
      const tx = Math.max(0, Math.min(W - VW, q[0] - VW / 2)), ty = Math.max(0, Math.min(H - VH, q[1] - VH / 2));
      const k = camSet && !calm ? Math.min(1, dt * 5) : 1;
      camX += (tx - camX) * k; camY += (ty - camY) * k; camSet = true;
    }

    function draw(t) {
      ctx.setTransform(1, 0, 0, 1, -Math.round(camX), -Math.round(camY));
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(I.bg, 0, 0);
      if (calm || t % 9 < 6.5) ctx.drawImage(I.win1, 0, 0);
      if (calm || (t + 3) % 13 < 8) ctx.drawImage(I.win2, 0, 0);

      if (goal) {
        const g = P(goal[0] + PS / 2, goal[1] + PS / 2, 0);
        ctx.fillStyle = '#ffd66e';
        ctx.fillRect(g[0] - 3, g[1], 2, 1); ctx.fillRect(g[0] + 2, g[1], 2, 1); ctx.fillRect(g[0] - 1, g[1] - 1, 3, 1); ctx.fillRect(g[0] - 1, g[1] + 1, 3, 1);
      }
      const pb = { x0: pl.x, x1: pl.x + PS, y0: pl.y, y1: pl.y + PS, z0: 0, z1: PH };
      const ord = order(pb);
      for (const i of ord) {
        if (i < 0) {
          const s = D.player[pl.face], q = P(pl.x, pl.y, 0);
          const bob = pl.moving && !calm && Math.floor(t * 8) % 2 ? 1 : 0;
          ctx.drawImage(PI[pl.face], q[0] + s.ox, q[1] + s.oy - bob);
          const ay = q[1] + s.oy - 7 - (calm ? 0 : Math.floor(t * 2) % 2);
          ctx.fillStyle = '#ffd66e';
          ctx.fillRect(q[0] - 2, ay, 5, 1); ctx.fillRect(q[0] - 1, ay + 1, 3, 1); ctx.fillRect(q[0], ay + 2, 1, 1);
        } else {
          const b = B[i];
          ctx.drawImage(I.atlas, b.ax, b.ay, b.w, b.h, b.dx, b.dy, b.w, b.h);
        }
      }
      for (const lane of LANES) for (const c of cars) {
        if (c.lane !== lane) continue;
        const s = D.cars[c.k][lane.key], q = P(c.x, lane.y, -3);
        ctx.globalAlpha = Math.max(0, Math.min(1, Math.min(c.x + c.L, FX - c.x) / 16));
        ctx.drawImage(CI[c.k + lane.key], q[0] + s.ox, q[1] + s.oy);
      }
      ctx.globalAlpha = 1;

      const c = t % 6;
      const aA = calm ? 1 : ((c > 1 && c < 1.07) || (c > 1.18 && c < 1.3) || (c > 4 && c < 4.05) ? 0.2 : 1);
      const aB = calm ? 1 : ((t * 1.3) % 7 > 6.88 ? 0.35 : 1);
      const aL = calm ? 0.8 : [0.35, 0.6, 0.85, 1][Math.floor((Math.sin(t * 1.6) * 0.5 + 0.5) * 3.99)];
      const aR = calm ? 1 : [0.3, 0.65, 1][Math.floor((Math.sin(t * 4) * 0.5 + 0.5) * 2.99)];
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(I.glowS, 0, 0);
      ctx.globalAlpha = aA; ctx.drawImage(I.glowA, 0, 0);
      ctx.globalAlpha = aB; ctx.drawImage(I.glowB, 0, 0);
      ctx.globalAlpha = aL; ctx.drawImage(I.glowL, 0, 0);
      ctx.globalAlpha = aR; ctx.drawImage(I.glowR, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = aA; ctx.drawImage(I.decA, 0, 0);
      ctx.globalAlpha = aB; ctx.drawImage(I.decB, 0, 0);
      ctx.globalAlpha = aL; ctx.drawImage(I.decL, 0, 0);
      ctx.globalAlpha = aR; ctx.drawImage(I.decR, 0, 0);
      ctx.globalAlpha = 1;
      ctx.drawImage(calm || Math.floor(t / 0.7) % 2 ? I.decS1 : I.decS2, 0, 0);

      D.steam.forEach((s, i) => {
        for (let k = 0; k < 3; k++) {
          const ph = calm ? k / 3 : (t * 0.45 + k / 3 + i * 0.17) % 1;
          ctx.fillStyle = 'rgba(244,240,255,' + ((1 - ph) * 0.65).toFixed(2) + ')';
          ctx.fillRect(s[0] + Math.round(Math.sin(ph * 6 + i) * 1.5), Math.floor(s[1] - 2 - ph * 12), 2, 2);
        }
      });
    }

    function updateBubble() {
      const cx = pl.x + PS / 2, cy = pl.y + PS / 2;
      let best = null;
      for (const s of SPOTS) { if (Math.hypot(s.x - cx, s.y - cy) < s.r) { best = s; break; } }
      if (best !== spot) {
        spot = best;
        bubble.hidden = !spot;
        if (spot) { bubbleText.textContent = spot.text; bubbleLink.hidden = !spot.link; }
      }
      if (spot) {
        const q = P(spot.x, spot.y, spot.z);
        bubble.style.left = Math.max(26, Math.min(74, (q[0] - Math.round(camX)) / VW * 100)) + '%';
        bubble.style.top = Math.max(16, Math.min(96, (q[1] - Math.round(camY)) / VH * 100)) + '%';
      }
    }

    let last = 0;
    function frame(ms) {
      const t = ms / 1000;
      const dt = Math.min(0.05, t - last || 0);
      last = t;
      step(dt);
      stepCars(t, dt);
      checkDoor();
      camera(dt);
      updateBubble();
      draw(t);
      requestAnimationFrame(frame);
    }
    camera(0);
    draw(0);
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
