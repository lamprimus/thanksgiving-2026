<body>
<style>
/* Layout: one screen. Neon title sign on top, the playable diorama in the middle, controls underneath. */
:root {
  --night: #0b0a1f;
  --panel: #1a1638;
  --ink: #f4ecff;
  --dim: #a59bd0;
  --pink: #ff6ebe;
  --cyan: #6eebff;
  --gold: #ffd66e;
  --display: 'Press Start 2P', 'Courier New', monospace;
  --body: 'DotGothic16', 'Courier New', monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  box-sizing: border-box;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.jp { color: var(--cyan); letter-spacing: 0.4em; font-size: 15px; text-shadow: 0 0 8px var(--cyan); margin: 0; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(17px, 4.4vw, 40px);
  line-height: 1.2;
  color: #fff4fb;
  text-shadow: 0 0 4px #fff, 0 0 12px var(--pink), 0 0 30px var(--pink);
  animation: flicker 6s infinite;
}
h1 span { animation: flicker 3.7s infinite 1.3s; }
@keyframes flicker { 0%, 17%, 19%, 21%, 23%, 66%, 68%, 100% { opacity: 1; } 18%, 22%, 67% { opacity: 0.35; } }
.meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 18px; }
.when { margin: 0; color: var(--gold); font-size: 18px; text-shadow: 0 0 8px rgba(255, 214, 110, 0.6); }
.rsvp {
  font-family: var(--display);
  font-size: 12px;
  color: var(--night);
  background: var(--gold);
  padding: 9px 12px;
  text-decoration: none;
  box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--gold), 0 0 18px rgba(255, 214, 110, 0.5);
}
.rsvp:hover { background: #fff; }
a:focus-visible, button:focus-visible, canvas:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.stage {
  position: relative;
  flex: none;
  width: min(100%, max(280px, calc((100vh - 215px) * 1.348)));
  width: min(100%, max(280px, calc((100dvh - 215px) * 1.348)));
  aspect-ratio: 496 / 368;
  max-width: 100%;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  background: var(--ink);
  color: var(--night);
  padding: 6px 9px;
  font-size: 14px;
  line-height: 1.3;
  width: max-content;
  max-width: 44%;
  text-align: center;
  box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.bubble a { color: #b3126c; font-weight: 700; }
footer { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hint { margin: 0; color: var(--dim); font-size: 14px; text-align: center; text-wrap: balance; }
.hint b { color: var(--gold); font-weight: 400; }
.pad { display: none; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 6px; }
.pad button {
  font-family: var(--display);
  font-size: 13px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--dim);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.pad button:active { background: var(--pink); color: var(--night); }
.pad [data-k="up"] { grid-column: 2; grid-row: 1; }
.pad [data-k="left"] { grid-column: 1; grid-row: 2; }
.pad [data-k="down"] { grid-column: 2; grid-row: 2; }
.pad [data-k="right"] { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { h1, h1 span { animation: none; } }
</style>

  function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
  const jobs = [];
  const I = {}, PI = {}, CI = {};

    function order(pb) {
      const done = new Uint8Array(n + 1), out = [], pp = [], front = new Uint8Array(n);

      const aB = calm ? 1 : ((t * 1.3) % 7 > 6.88 ? 0.35 : 1);
      const aL = calm ? 0.8 : [0.35, 0.6, 0.85, 1][Math.floor((Math.sin(t * 1.6) * 0.5 + 0.5) * 3.99)];
      const aR = calm ? 1 : [0.3, 0.65, 1][Math.floor((Math.sin(t * 4) * 0.5 + 0.5) * 2.99)];
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(I.glowS, 0, 0);
      ctx.globalAlpha = aA; ctx.drawImage(I.glowA, 0, 0);
      ctx.globalAlpha = aB; ctx.drawImage(I.glowB, 0, 0);
      ctx.globalAlpha = aL; ctx.drawImage(I.glowL, 0, 0);
      ctx.globalAlpha = aR; ctx.drawImage(I.glowR, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = aA; ctx.drawImage(I.decA, 0, 0);
      ctx.globalAlpha = aB; ctx.drawImage(I.decB, 0, 0);
      ctx.globalAlpha = aL; ctx.drawImage(I.decL, 0, 0);
      ctx.globalAlpha = aR; ctx.drawImage(I.decR, 0, 0);
      ctx.globalAlpha = 1;
      ctx.drawImage(calm || Math.floor(t / 0.7) % 2 ? I.decS1 : I.decS2, 0, 0);

      D.steam.forEach((s, i) => {
        for (let k = 0; k < 3; k++) {
          const ph = calm ? k / 3 : (t * 0.45 + k / 3 + i * 0.17) % 1;
          ctx.fillStyle = 'rgba(244,240,255,' + ((1 - ph) * 0.65).toFixed(2) + ')';
          ctx.fillRect(s[0] + Math.round(Math.sin(ph * 6 + i) * 1.5), Math.floor(s[1] - 2 - ph * 12), 2, 2);
        }
      });
    }

    function updateBubble() {
      const cx = pl.x + PS / 2, cy = pl.y + PS / 2;
      let best = null;
      for (const s of SPOTS) { if (Math.hypot(s.x - cx, s.y - cy) < s.r) { best = s; break; } }
      if (best === spot) return;
      spot = best;
      if (!spot) { bubble.hidden = true; return; }
      const q = P(spot.x, spot.y, spot.z);
      bubble.style.left = Math.max(24, Math.min(76, q[0] / W * 100)) + '%';
      bubble.style.top = (q[1] / H * 100) + '%';
      bubbleText.textContent = spot.text;
      bubbleLink.hidden = !spot.link;
      bubble.hidden = false;
    }

    let last = 0;
    function frame(ms) {
      const t = ms / 1000;
      const dt = Math.min(0.05, t - last || 0);
      last = t;
      step(dt);
      stepCars(t, dt);
      checkDoor();
      updateBubble();
      draw(t);
      requestAnimationFrame(frame);
    }
    draw(0);
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
